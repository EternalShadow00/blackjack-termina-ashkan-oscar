<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Blackjack en la terminal">
  <defs>
    <radialGradient id="tapete" cx="35%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1b6b4c"/>
      <stop offset="1" stop-color="#0a3526"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tapete -->
  <rect width="960" height="300" rx="18" fill="url(#tapete)"/>
  <rect x="10" y="10" width="940" height="280" rx="12" fill="none" stroke="#e0b84f" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M40 270 Q480 200 920 270" fill="none" stroke="#e0b84f" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- carta: As de picas -->
  <g transform="translate(70 62) rotate(-9 60 85)" filter="url(#sombra)">
    <rect width="120" height="170" rx="12" fill="#fbfaf6" stroke="#d6d2c4"/>
    <text x="13" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1a1a1a">A</text>
    <text x="14" y="58" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif" font-size="22" fill="#1a1a1a">♠</text>
    <text x="60" y="112" text-anchor="middle" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif" font-size="64" fill="#1a1a1a">♠</text>
  </g>

  <!-- carta: Rey de corazones -->
  <g transform="translate(158 72) rotate(8 60 85)" filter="url(#sombra)">
    <rect width="120" height="170" rx="12" fill="#fbfaf6" stroke="#d6d2c4"/>
    <text x="13" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#c62828">K</text>
    <text x="14" y="58" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif" font-size="22" fill="#c62828">♥</text>
    <text x="60" y="112" text-anchor="middle" font-family="Segoe UI Symbol, DejaVu Sans, sans-serif" font-size="64" fill="#c62828">♥</text>
  </g>

  <!-- ficha 21 -->
  <g transform="translate(300 232)" filter="url(#sombra)">
    <circle r="36" fill="#b71c1c"/>
    <circle r="36" fill="none" stroke="#fbfaf6" stroke-width="7" stroke-dasharray="9 9.85"/>
    <circle r="25" fill="none" stroke="#fbfaf6" stroke-opacity="0.6" stroke-width="1.5"/>
    <text y="9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fbfaf6">21</text>
  </g>

  <!-- título -->
  <text x="372" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="5" fill="#f6f1e1">BLACKJACK</text>
  <text x="376" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cfe8d6">en la terminal · Python · Git &amp; GitHub</text>
  <text x="376" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="1" fill="#e0b84f">♠ ♥ ♦ ♣   Ashkan &amp; Óscar · 2º DAW · IES María Moliner</text>
</svg>
